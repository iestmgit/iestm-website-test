<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects | IESTM</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="lang-fa">

  <div id="header-placeholder"></div>

  <section class="section">
    <div class="container">
      <h2 class="section-title" data-i18n="projects.allTitle">همه <span class="gold">پروژه‌ها</span></h2>
      <p class="section-sub" data-i18n="projects.allSub">مجموعه‌ای از خلاقیت‌های ما</p>
      <div class="projects-grid" id="allProjectsGrid"></div>
    </div>
  </section>

  <footer class="footer" id="footerContainer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-brand"><h3>IESTM</h3><p data-i18n="footer.aboutShort">برند نرم‌افزاری مستقل</p></div>
        <div class="footer-links"><h4 data-i18n="footer.quickLinks">دسترسی سریع</h4><a href="/" data-i18n="menu.home">خانه</a><a href="about.html" data-i18n="menu.about">درباره ما</a><a href="projects.html" data-i18n="menu.projects">پروژه‌ها</a><a href="contact.html" data-i18n="menu.contact">تماس</a></div>
        <div class="footer-social"><h4 data-i18n="footer.followUs">ما را دنبال کنید</h4><div class="social-icons"><a href="https://instagram.com/iestm" target="_blank">📸</a><a href="https://t.me/iestm" target="_blank">✈️</a><a href="https://github.com/iestmgit" target="_blank">🐙</a><a href="https://youtube.com/@iestm" target="_blank">▶️</a></div></div>
      </div>
      <div class="footer-bottom" data-i18n="footer.copyright">۱۴۰۴ © تمامی حقوق محفوظ است.</div>
    </div>
  </footer>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/loader.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await window.I18N.load();
      window.I18N.applyLanguage(window.I18N.getLanguage());

      try {
        const res = await fetch('/website-data.json');
        const data = await res.json();
        const lang = window.I18N.getLanguage();
        const projects = data.projects[lang] || data.projects.en;

        document.getElementById('allProjectsGrid').innerHTML = projects.map(p => `
          <div class="project-card">
            <div class="project-card-image">🖥️</div>
            <div class="project-card-body">
              <h3>${p.title}</h3>
              <p>${p.description}</p>
              <span class="tech">${p.tech}</span>
              <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
                ${p.demo !== '#' ? `<a href="${p.demo}" class="btn btn-primary" style="padding:6px 18px; font-size:0.75rem;">${lang === 'en' ? 'Demo' : 'دمو'}</a>` : ''}
                ${p.github !== '#' ? `<a href="${p.github}" target="_blank" class="btn btn-outline" style="padding:6px 18px; font-size:0.75rem;">GitHub</a>` : ''}
              </div>
            </div>
          </div>
        `).join('');
      } catch(e) { console.error(e); }
    });
  </script>
</body>
</html>
