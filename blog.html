<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog | IESTM</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="lang-fa">

  <div id="header-placeholder"></div>

  <section class="section">
    <div class="container">
      <h2 class="section-title" data-i18n="blog.allTitle">وبلاگ <span class="gold">ایستم</span></h2>
      <p class="section-sub" data-i18n="blog.allSub">جدیدترین مطالب و آموزش‌ها</p>
      <div class="blog-grid" id="allBlogGrid"></div>
    </div>
  </section>

  <footer class="footer" id="footerContainer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-brand"><h3>IESTM</h3><p data-i18n="footer.aboutShort">برند نرم‌افزاری مستقل</p></div>
        <div class="footer-links"><h4 data-i18n="footer.quickLinks">دسترسی سریع</h4><a href="/" data-i18n="menu.home">خانه</a><a href="about.html" data-i18n="menu.about">درباره ما</a><a href="projects.html" data-i18n="menu.projects">پروژه‌ها</a><a href="contact.html" data-i18n="menu.contact">تماس</a></div>
        <div class="footer-social"><h4 data-i18n="footer.followUs">ما را دنبال کنید</h4><div class="social-icons"><a href="https://instagram.com/iestm" target="_blank">📸</a><a href="https://t.me/iestm" target="_blank">✈️</a><a href="https://github.com/iestmgit" target="_blank">🐙</a><a href="https://youtube.com/@iestm" target="_blank">▶️</a></div></div>
      </div>
      <div class="footer-bottom" data-i18n="footer.copyright">۱۴۰۴ © تمامی حقوق محفوظ است.</div>
    </div>
  </footer>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/loader.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await window.I18N.load();
      window.I18N.applyLanguage(window.I18N.getLanguage());

      try {
        const res = await fetch('/website-data.json');
        const data = await res.json();
        const lang = window.I18N.getLanguage();
        const posts = data.blog[lang] || data.blog.en;

        document.getElementById('allBlogGrid').innerHTML = posts.map(post => `
          <div class="blog-card">
            <div class="date">${post.date}</div>
            <h3>${post.title}</h3>
            <p>${post.summary}</p>
            <a href="${post.link}" class="read-more">${lang === 'en' ? 'Read more →' : 'ادامه مطلب →'}</a>
          </div>
        `).join('');
      } catch(e) { console.error(e); }
    });
  </script>
</body>
</html>
